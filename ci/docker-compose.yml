# Self-hosted GitHub Actions runners for zserio-c CI.
#
# Three runner instances on one host. A single runner process takes
# one job at a time; running three lets GitHub dispatch the lighter
# CI jobs in parallel.
#
# Each runner's name comes from `${RUNNER_NAME_PREFIX:-zserio-ci}-N`.
# Default (prefix unset) gives zserio-ci-1/2/3. To host multiple
# runner pools (e.g. one AMD primary + one Pi 4 perf runner), set
# RUNNER_NAME_PREFIX in each host's `.env` to something host-unique
# (e.g. RUNNER_NAME_PREFIX=pi4-zserio-ci) so registrations don't
# collide on GitHub.
#
# Setup:
#   1. cp ci/.env.example ci/.env  and fill in GITHUB_PAT
#   2. docker compose -f ci/docker-compose.yml up -d --build
#
# The image is built once and shared by all three services.
#
# No named volumes: the runner's `_work` directory lives in the
# container's own writable layer, created by the unprivileged
# `runner` user, so there is no volume-ownership problem to manage.
# Cross-run caching of the upstream zserio jars is handled by
# `actions/cache` in the workflow (GitHub-backed cache storage), so
# a persistent `_work` volume bought little and cost a recurring
# root-owned-volume headache.

services:
  runner-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: zserio-ci-runner:latest
    # container_name is parameterized by RUNNER_NAME_PREFIX so two
    # deployments on the same host (e.g. one repo-scoped against
    # the shadow mirror, one org-scoped against Klebert-Engineering)
    # don't collide on the Docker daemon. `-p <project>` only
    # namespaces auto-generated names; an explicit container_name
    # overrides that, so the only way to keep both deployments is
    # to drive the prefix from the environment. Default matches the
    # historical name, so existing single-deployment hosts are
    # unaffected.
    container_name: ${RUNNER_NAME_PREFIX:-zserio-ci}-runner-1
    restart: unless-stopped
    env_file: .env
    environment:
      RUNNER_NAME: ${RUNNER_NAME_PREFIX:-zserio-ci}-1
    # Cap each runner's memory so a heavy LTO build can't starve DSM.
    # No `cpus:` limit — the Synology DSM kernel is built without CPU
    # CFS quota support, so Docker rejects NanoCPUs ("kernel does not
    # support CPU CFS scheduler"). Memory cgroups *are* supported.
    # The 2-core host naturally serialises CPU pressure anyway.
    deploy:
      resources:
        limits:
          memory: 8g

  runner-2:
    image: zserio-ci-runner:latest
    container_name: ${RUNNER_NAME_PREFIX:-zserio-ci}-runner-2
    restart: unless-stopped
    env_file: .env
    environment:
      RUNNER_NAME: ${RUNNER_NAME_PREFIX:-zserio-ci}-2
    deploy:
      resources:
        limits:
          memory: 8g
    depends_on:
      - runner-1   # ensures the image is built once before this starts

  runner-3:
    image: zserio-ci-runner:latest
    container_name: ${RUNNER_NAME_PREFIX:-zserio-ci}-runner-3
    restart: unless-stopped
    env_file: .env
    environment:
      RUNNER_NAME: ${RUNNER_NAME_PREFIX:-zserio-ci}-3
    deploy:
      resources:
        limits:
          memory: 8g
    depends_on:
      - runner-1
