name: CI

on:
  push:
    branches: [main]
  pull_request:

# Runner policy: same-repo runs — pushes and pull requests whose
# head branch lives in this repository (only people with push
# access can create those) — use the fast self-hosted org runners.
# Fork PRs must NEVER reach the self-hosted machines (a fork PR
# executes arbitrary code, including edited workflow files); every
# job therefore computes its runner dynamically:
#
#   runs-on: fork PR  -> ubuntu-latest (GitHub-hosted, free for
#                        public repos)
#             otherwise -> [self-hosted, linux, x64]
#
# The `perf` job is the exception: it needs the dedicated
# bare-metal measurement hosts, has no hosted fallback, and simply
# skips for fork PRs. See docs/ci-self-hosted.md for the runner
# deployment and the defense-in-depth settings backing this up.
#
# Least privilege by default: the build/test/lint jobs only read the
# checkout. Jobs that post log comments raise their own scope locally
# with an explicit `permissions:` block. (Hardening: without a
# workflow-level default, jobs inherit the repo's token scope, which
# is often read-write to every API.)
permissions:
  contents: read

# Cancel superseded runs of the same PR/branch. The perf job opts
# out via its own per-host concurrency group (a fresh commit must
# not kill an in-flight measurement).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  traceability:
    name: Requirements traceability
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || '["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4.3.1
        with:
          submodules: false
      # python3 is provided by both the runner image and
      # ubuntu-latest — no actions/setup-python needed.
      - name: Run traceability check + regenerate CSV
        run: python3 tools/check_traceability.py --write-csv
      - name: Fail if committed traceability.csv is stale
        run: git diff --exit-code requirements/traceability.csv

  version-consistency:
    name: Version consistency (REQ-DM-007)
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || '["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4.3.1
        with:
          submodules: false
      - name: Cross-check version sources
        run: python3 tools/check_version_consistency.py

  build-and-test:
    name: Build and test (${{ matrix.compiler }})
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || '["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc
          - compiler: clang
            cc: clang
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4.3.1
        with:
          submodules: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang
      - name: Configure
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Debug
        env:
          CC: ${{ matrix.cc }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  packaging:
    name: Packaging (install + find_package consumer)
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || '["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4.3.1
        with:
          submodules: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build and install to a scratch prefix
        run: |
          cmake -B build-pkg -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DZSERIO_C_BUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/prefix"
          cmake --build build-pkg
          cmake --install build-pkg
      - name: Build and run a find_package consumer
        # End-to-end: find_package(zserio_c) -> run zserio_c::gen on a
        # schema -> compile generated code -> link zserio_c::runtime ->
        # byte round-trip. Guards the install/export rules against rot.
        run: |
          set -eu
          C="${RUNNER_TEMP}/consumer"
          mkdir -p "$C"
          printf 'package demo;\n\nstruct Point {\n    uint32 x;\n    uint32 y;\n    string label;\n};\n' > "$C/demo.zs"
          cat > "$C/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(consumer LANGUAGES C)
          find_package(zserio_c 0.1 REQUIRED)
          set(GEN_DIR ${CMAKE_CURRENT_BINARY_DIR}/gen)
          add_custom_command(
              OUTPUT ${GEN_DIR}/demo/point.c ${GEN_DIR}/demo/point.h
              COMMAND ${CMAKE_COMMAND} -E make_directory ${GEN_DIR}
              COMMAND zserio_c::gen ${CMAKE_CURRENT_SOURCE_DIR}/demo.zs -c ${GEN_DIR}
              DEPENDS ${CMAKE_CURRENT_SOURCE_DIR}/demo.zs
          )
          add_executable(consumer main.c ${GEN_DIR}/demo/point.c)
          target_include_directories(consumer PRIVATE ${GEN_DIR})
          target_link_libraries(consumer PRIVATE zserio_c::runtime)
          CMAKE
          cat > "$C/main.c" <<'CSRC'
          #include <stdio.h>
          #include <string.h>
          #include "demo/point.h"

          int main(void)
          {
              zserio_allocator_t alloc = zserio_allocator_libc();
              demo_point_t p;
              demo_point_init(&p);
              p.x = 7U;
              p.y = 42U;
              p.label.bytes = (char *)"hello";   /* borrowed; p is not freed */
              p.label.length = 5U;
              uint8_t buf[64];
              zserio_bitstream_writer_t w;
              if (zserio_bitstream_writer_init(&w, buf, sizeof(buf) * 8U) != ZSERIO_OK) return 1;
              if (demo_point_write(&p, &w) != ZSERIO_OK) return 1;
              zserio_bitstream_reader_t r;
              if (zserio_bitstream_reader_init(&r, buf,
                      zserio_bitstream_writer_position(&w)) != ZSERIO_OK) return 1;
              demo_point_t q;
              demo_point_init(&q);
              if (demo_point_read(&q, &r, &alloc) != ZSERIO_OK) return 1;
              const int ok = (q.x == 7U) && (q.y == 42U) && (q.label.length == 5U)
                  && (memcmp(q.label.bytes, "hello", 5U) == 0);
              demo_point_free(&q, &alloc);
              printf(ok ? "CONSUMER_OK\n" : "CONSUMER_MISMATCH\n");
              return ok ? 0 : 1;
          }
          CSRC
          cmake -B "$C/build" -S "$C" -G Ninja -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/prefix"
          cmake --build "$C/build"
          "$C/build/consumer" | grep -q CONSUMER_OK

  asan:
    name: Sanitizers (ASan + UBSan)
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || '["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4.3.1
        with:
          submodules: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Configure with ASan + UBSan
        # -fno-sanitize-recover=all so a UBSan finding aborts (and thus
        # fails ctest) instead of printing and continuing. Frame pointers
        # kept for readable sanitizer backtraces.
        run: |
          cmake -B build-asan -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
        env:
          CC: clang
      - name: Build
        run: cmake --build build-asan
      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure

  clang-tidy:
    name: clang-tidy (bugprone / cert / clang-analyzer)
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || '["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 30
    permissions:
      contents: write   # for posting the clang-tidy log as a commit comment
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4.3.1
        with:
          submodules: false
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang clang-tidy ninja-build cmake
      - name: Run clang-tidy (strict)
        # The .clang-tidy config gates only the bug- and security-relevant
        # families (WarningsAsErrors); readability size/complexity checks
        # stay advisory. The script configures its own throwaway build with
        # tests OFF, so no Unity fetch / network access is needed.
        run: tools/run_clang_tidy.sh --strict
      - name: Upload clang-tidy log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: clang-tidy-log
          path: clang-tidy.log
      - name: Post clang-tidy output as commit comment
        # Push events only: fork PRs run with a read-only token,
        # so posting would fail the job; PR feedback is the check
        # status itself.
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          if [[ -s clang-tidy.log ]]; then
            LOG_LINES="$(wc -l < clang-tidy.log | tr -d ' ')"
            LOG_BYTES="$(wc -c < clang-tidy.log | tr -d ' ')"
            LOG_BODY="$(head -c 60000 clang-tidy.log)"
            HEADER="clang-tidy.log (${LOG_LINES} lines, ${LOG_BYTES} bytes) for commit ${GITHUB_SHA}"
          else
            LOG_BODY="(empty — clang-tidy produced no output)"
            HEADER="clang-tidy.log (0 bytes) for commit ${GITHUB_SHA}"
          fi
          {
            printf '%s\n\n```\n' "${HEADER}"
            printf '%s' "${LOG_BODY}"
            printf '\n```\n'
          } > /tmp/comment_body.md
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -F body=@/tmp/comment_body.md \
            -H 'Accept: application/vnd.github+json'

  misra:
    name: MISRA C:2012 (cppcheck) + forbidden-symbols
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || '["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 30
    permissions:
      contents: write   # for posting cppcheck output as a commit comment
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4.3.1
        with:
          submodules: false
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Run MISRA + forbidden-symbols check
        # Strict mode: any cppcheck error fails the build. All known
        # findings are either fixed or covered by an entry in
        # tools/cppcheck-suppressions.txt with a sibling deviation
        # document under docs/misra-deviations/.
        run: tools/run_misra.sh --strict
      - name: Upload cppcheck log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: cppcheck-log
          path: cppcheck.log
      - name: Post cppcheck output as commit comment
        # The artifact path requires Azure blob access which our
        # development environment can't reach. Posting the log as a
        # commit comment keeps it accessible through the plain
        # repos/.../commits/<sha>/comments endpoint. Push events
        # only: fork PRs run with a read-only token.
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          if [[ -s cppcheck.log ]]; then
            LOG_LINES="$(wc -l < cppcheck.log | tr -d ' ')"
            LOG_BYTES="$(wc -c < cppcheck.log | tr -d ' ')"
            # Truncate body to under the GitHub comment limit (65536) just in case.
            LOG_BODY="$(head -c 60000 cppcheck.log)"
            HEADER="cppcheck.log (${LOG_LINES} lines, ${LOG_BYTES} bytes) for commit ${GITHUB_SHA}"
          else
            LOG_BODY="(empty — cppcheck produced no output)"
            HEADER="cppcheck.log (0 bytes) for commit ${GITHUB_SHA}"
          fi
          {
            printf '%s\n\n```\n' "${HEADER}"
            printf '%s' "${LOG_BODY}"
            printf '\n```\n'
          } > /tmp/comment_body.md
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -F body=@/tmp/comment_body.md \
            -H 'Accept: application/vnd.github+json'

  misra-generator:
    name: MISRA C:2012 (generator output)
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || '["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 60
    permissions:
      contents: write   # for posting cppcheck output as a commit comment
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4.3.1
        with:
          submodules: false
      - name: Init upstream + test-data submodules
        # third_party/zserio          — ZserioTool + upstream ant jars
        # third_party/zserio-test-data — corpus the representative set
        #   is drawn from (see tools/run_misra_generated.sh)
        run: git submodule update --init third_party/zserio third_party/zserio-test-data
      - name: Install build + analysis tools
        run: sudo apt-get update && sudo apt-get install -y ant cppcheck
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9   # v4.8.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache upstream zserio jars
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: build-jars
          key: zserio-bundle-${{ hashFiles('third_party/zserio/compiler/**') }}
      - name: Build upstream zserio bundle
        shell: bash
        run: |
          set -o pipefail
          tools/build_zserio_core_jar.sh
          tools/build_zserio_bundle_jar.sh
      - name: Build zserio_c.jar
        shell: bash
        run: tools/build_generator_jar.sh
      - name: Run MISRA on generator output (strict)
        # Strict mode: any cppcheck finding fails the build. Findings
        # are either fixed in the generator templates or covered by an
        # entry in `tools/cppcheck-suppressions.txt` (shared with the
        # runtime gate) or by a `--suppress=...` flag in
        # `tools/run_misra_generated.sh` (generator-only suppressions
        # — documented in `tools/cppcheck-suppressions.md` and in the
        # relevant `docs/misra-deviations/D*.md`).
        shell: bash
        run: |
          set -o pipefail
          tools/run_misra_generated.sh --strict 2>&1 | tee misra-generated.log
      - name: Post cppcheck output as commit comment
        # Push events only: fork PRs run with a read-only token,
        # so posting would fail the job; PR feedback is the check
        # status itself.
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          if [[ -s misra-generated.log ]]; then
            LOG_LINES="$(wc -l < misra-generated.log | tr -d ' ')"
            LOG_BYTES="$(wc -c < misra-generated.log | tr -d ' ')"
            LOG_BODY="$(head -c 60000 misra-generated.log)"
            HEADER="MISRA on generator output for commit ${GITHUB_SHA} — ${LOG_LINES} lines, ${LOG_BYTES} bytes"
          else
            LOG_BODY="(empty)"
            HEADER="MISRA on generator output for commit ${GITHUB_SHA}"
          fi
          {
            printf '%s\n\n```\n' "${HEADER}"
            printf '%s' "${LOG_BODY}"
            printf '\n```\n'
          } > /tmp/comment_body.md
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -F body=@/tmp/comment_body.md \
            -H 'Accept: application/vnd.github+json'

  fuzz:
    name: Decode-path fuzzing (REQ-FS-006)
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || '["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 60
    permissions:
      contents: write   # for posting the fuzz log as a commit comment
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4.3.1
        with:
          submodules: false
      - name: Init upstream + test-data submodules
        # third_party/zserio          — ZserioTool + upstream ant jars
        # third_party/zserio-test-data — corpus the fuzz targets'
        #   schemas are drawn from (matched by tests/fuzz/targets.txt)
        run: git submodule update --init third_party/zserio third_party/zserio-test-data
      - name: Install build + analysis tools
        # `clang` on Ubuntu 24.04 is clang-18 (a meta-package). The
        # libFuzzer + ASan + UBSan runtime archives ship in a separate
        # `libclang-rt-18-dev` package — without it, the link step
        # fails with `cannot find libclang_rt.fuzzer-x86_64.a`. If the
        # image upgrades to a newer clang, bump the version number.
        run: sudo apt-get update && sudo apt-get install -y ant clang libclang-rt-18-dev
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9   # v4.8.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache upstream zserio jars
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: build-jars
          key: zserio-bundle-${{ hashFiles('third_party/zserio/compiler/**') }}
      - name: Build upstream zserio bundle
        shell: bash
        run: |
          set -o pipefail
          tools/build_zserio_core_jar.sh
          tools/build_zserio_bundle_jar.sh
      - name: Build zserio_c.jar
        shell: bash
        run: tools/build_generator_jar.sh
      - name: Restore fuzz corpus
        # Cache key is per-run-id so each run pushes a fresh save;
        # restore-keys picks the most recent prefix match so the
        # corpus accumulates across commits. A targets.txt change
        # bumps the prefix and the corpus starts fresh — intentional
        # (the corpus shape is tied to the set of fuzz targets).
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: tests/fuzz/corpus
          key: fuzz-corpus-${{ hashFiles('tests/fuzz/targets.txt') }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ hashFiles('tests/fuzz/targets.txt') }}-
            fuzz-corpus-
      - name: Run fuzzers
        # Strict: each target gets FUZZ_SECONDS=60 of libFuzzer time +
        # a 10 s per-input timeout — any crash, leak, or sanitizer trip
        # fails the build. The corpus is persisted across runs via
        # actions/cache so subsequent runs build on the inputs the
        # previous one discovered.
        shell: bash
        run: |
          set -o pipefail
          FUZZ_SECONDS=60 tools/run_fuzz.sh 2>&1 | tee fuzz.log
      - name: Post fuzz log as commit comment
        # Push events only: fork PRs run with a read-only token,
        # so posting would fail the job; PR feedback is the check
        # status itself.
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          if [[ -s fuzz.log ]]; then
            LOG_LINES="$(wc -l < fuzz.log | tr -d ' ')"
            LOG_BYTES="$(wc -c < fuzz.log | tr -d ' ')"
            LOG_BODY="$(tail -c 60000 fuzz.log)"
            HEADER="Decode-path fuzz log for commit ${GITHUB_SHA} — ${LOG_LINES} lines, ${LOG_BYTES} bytes (tail of run)"
          else
            LOG_BODY="(empty)"
            HEADER="Decode-path fuzz log for commit ${GITHUB_SHA}"
          fi
          {
            printf '%s\n\n```\n' "${HEADER}"
            printf '%s' "${LOG_BODY}"
            printf '\n```\n'
          } > /tmp/comment_body.md
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -F body=@/tmp/comment_body.md \
            -H 'Accept: application/vnd.github+json'

  stack:
    name: Stack-budget analysis (REQ-FS-003, hazard H-09)
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || '["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 30
    permissions:
      contents: write   # for posting the stack-usage report as a commit comment
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4.3.1
        with:
          submodules: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Measure and gate stack usage
        # `set -o pipefail` so the script's non-zero exit propagates
        # through `tee` and fails the step as it should.
        shell: bash
        run: |
          set -o pipefail
          python3 tools/measure_stack_usage.py --strict | tee stack-report.txt
      - name: Post stack report as commit comment
        # Push events only: fork PRs run with a read-only token,
        # so posting would fail the job; PR feedback is the check
        # status itself.
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          {
            printf 'stack-budget report (REQ-FS-003, hazard H-09) for commit %s:\n\n```\n' "${GITHUB_SHA}"
            cat stack-report.txt
            printf '\n```\n'
          } > /tmp/comment_body.md
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -F body=@/tmp/comment_body.md \
            -H 'Accept: application/vnd.github+json'

  size:
    name: Size regression (REQ-PF-002)
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || '["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 30
    permissions:
      contents: write   # for posting the size diff as a commit comment
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4.3.1
        with:
          submodules: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build binutils
      - name: Measure sizes
        run: python3 tools/measure_size.py > sizes.json
      - name: Check regression vs baseline
        # `set -o pipefail` so the script's non-zero exit propagates
        # through `tee` and fails the step as it should.
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_size_regression.py sizes.json | tee size-report.txt
      - name: Post size report as commit comment
        # Push events only: fork PRs run with a read-only token,
        # so posting would fail the job; PR feedback is the check
        # status itself.
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          {
            printf 'size report (REQ-PF-002) for commit %s:\n\n```\n' "${GITHUB_SHA}"
            cat size-report.txt
            printf '\n```\n'
          } > /tmp/comment_body.md
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -F body=@/tmp/comment_body.md \
            -H 'Accept: application/vnd.github+json'

  perf:
    name: Performance benchmark (REQ-PF-001, host=${{ matrix.host }})
    # SECURITY: runs only for pushes and same-repo PRs — a fork PR
    # could otherwise execute arbitrary code on the measurement
    # hosts. No hosted fallback (perf numbers off the dedicated
    # hosts are meaningless), so fork PRs skip this job. The
    # repository guard keeps forks of this workflow from queueing
    # jobs that would hang waiting for runners they don't have.
    if: >-
      github.repository == 'Klebert-Engineering/zserio-c' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    # Routed to runners labelled `[self-hosted, perf, <host>]`. The
    # matrix's single entry today (`primary`) is the canonical per-
    # commit perf box; new hosts (pi5, macmini, jetson, ...) join the
    # list as their runners come online. See
    # docs/benchmarks/methodology.md for the multi-host policy.
    runs-on: [self-hosted, perf, "${{ matrix.host }}"]
    timeout-minutes: 120
    # One perf run per host at a time — running two on the same host
    # in parallel destroys the measurement (cache contention, jitter).
    # Different hosts (different matrix entries) run independently.
    # cancel-in-progress: false so a new commit doesn't kill an
    # in-flight measurement; we'd rather wait and get clean numbers.
    concurrency:
      group: perf-${{ matrix.host }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        host: [primary, pi4]
    permissions:
      contents: write   # for posting the benchmark report as a commit comment
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4.3.1
        with:
          submodules: false
      - name: Init upstream submodules
        # third_party/zserio        — upstream schemas + cpp runtime
        # zserio-benchmarks-datasets — JSON datasets the corpus workloads
        #   bootstrap from; without it the harness skips apollo /
        #   addressbook (and its _align/_packed variants) /
        #   carsales (+ variants) / simpletrace (+ variant).
        run: git submodule update --init third_party/zserio third_party/zserio-benchmarks-datasets
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ant gcc g++
      # JDK 17 + JAVA_HOME provided by the runner image (ci/Dockerfile).
      - name: Cache upstream zserio jars
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: build-jars
          key: zserio-bundle-${{ hashFiles('third_party/zserio/compiler/**') }}
      - name: Build upstream zserio bundle
        shell: bash
        run: |
          set -o pipefail
          tools/build_zserio_core_jar.sh
          tools/build_zserio_bundle_jar.sh
      - name: Build zserio_c.jar
        shell: bash
        run: tools/build_generator_jar.sh
      - name: Run benchmark harness
        shell: bash
        run: |
          set -o pipefail
          RUNS=5 INNER_ITERS=200000 bash tests/benchmarks/run_benchmark.sh > perf.json
      - name: Report regression against this host's baseline
        shell: bash
        # Per-host baseline at docs/benchmarks/perf.baseline.<host>.json.
        # First run on a new host seeds the file and exits OK; subsequent
        # runs compare against it. Each host has its own noise floor;
        # cross-host comparison is a *reporting* artifact, never a gate.
        # See docs/benchmarks/methodology.md.
        env:
          PERF_HOST: ${{ matrix.host }}
        run: |
          set -o pipefail
          python3 tools/check_perf_regression.py perf.json | tee perf-report.txt
      - name: Post benchmark report as commit comment
        # Push events only: fork PRs run with a read-only token,
        # so posting would fail the job; PR feedback is the check
        # status itself.
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERF_HOST: ${{ matrix.host }}
        run: |
          set -u
          {
            printf 'performance benchmark (REQ-PF-001) — host **%s** — for commit %s:\n\n```\n' \
                   "${PERF_HOST}" "${GITHUB_SHA}"
            if [[ -s perf-report.txt ]]; then
              cat perf-report.txt
              printf '\n--- raw JSON ---\n'
            fi
            if [[ -s perf.json ]]; then
              cat perf.json
            fi
            printf '\n```\n'
          } > /tmp/comment_body.md
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -F body=@/tmp/comment_body.md \
            -H 'Accept: application/vnd.github+json'

  generator:
    name: Legacy Java generator (build JAR + smoke load)
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || '["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 30
    permissions:
      contents: write   # for posting build logs as a commit comment
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4.3.1
        with:
          submodules: false
      - name: Init upstream submodule
        run: git submodule update --init third_party/zserio
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ant
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9   # v4.8.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache upstream zserio_core.jar
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: build-jars
          key: zserio-core-${{ hashFiles('third_party/zserio/compiler/core/**') }}
      - name: Build upstream zserio_core.jar
        shell: bash
        run: |
          set -o pipefail
          tools/build_zserio_core_jar.sh 2>&1 | tee -a /tmp/generator.log
      - name: Build zserio_c.jar
        shell: bash
        run: |
          set -o pipefail
          tools/build_generator_jar.sh 2>&1 | tee -a /tmp/generator.log
      - name: Smoke-load via ZserioTool
        shell: bash
        run: |
          set -o pipefail
          tools/smoke_generator.sh 2>&1 | tee -a /tmp/generator.log
      - name: Post build log as commit comment
        # Push events only: fork PRs run with a read-only token,
        # so posting would fail the job; PR feedback is the check
        # status itself.
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          if [[ ! -f /tmp/generator.log ]]; then
            echo "(no log captured)" > /tmp/generator.log
          fi
          {
            printf 'legacy Java generator build log for commit %s:\n\n```\n' "${GITHUB_SHA}"
            tail -c 50000 /tmp/generator.log
            printf '\n```\n'
          } > /tmp/comment_body.md
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -F body=@/tmp/comment_body.md \
            -H 'Accept: application/vnd.github+json'

  discover:
    name: Test-data discovery (advisory)
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || '["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 60
    permissions:
      contents: write   # for posting the discovery summary as a commit comment
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4.3.1
        with:
          submodules: false
      - name: Init submodules
        # Both upstream zserio (we need ZserioTool + the ant jars) and
        # the test-data corpus.
        run: |
          git submodule update --init third_party/zserio
          git submodule update --init third_party/zserio-test-data
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ant
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9   # v4.8.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache upstream zserio_core.jar
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: build-jars
          key: zserio-core-${{ hashFiles('third_party/zserio/compiler/core/**') }}
      - name: Build upstream zserio_core.jar
        run: tools/build_zserio_core_jar.sh
      - name: Build zserio_c.jar
        run: tools/build_generator_jar.sh
      - name: Run discovery
        # Advisory: never fails CI even when the corpus contains
        # schemas the generator can't yet handle. The summary tells
        # us which feature gap to attack next.
        run: tools/discover_test_data.sh 2>&1 | tee /tmp/discover.log
      - name: Post discovery summary as commit comment
        # Push events only: fork PRs run with a read-only token,
        # so posting would fail the job; PR feedback is the check
        # status itself.
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          if [[ -f build-discover/summary.md ]]; then
            BODY="$(cat build-discover/summary.md)"
          else
            BODY="(discovery did not produce a summary — see /tmp/discover.log)"
          fi
          {
            printf 'test-data discovery for commit %s:\n\n' "${GITHUB_SHA}"
            printf '%s\n' "${BODY}"
          } > /tmp/comment_body.md
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -F body=@/tmp/comment_body.md \
            -H 'Accept: application/vnd.github+json'
      - name: Upload full discovery results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: discover-results
          path: build-discover/

  coverage:
    name: Coverage (line / branch / function thresholds)
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || '["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 30
    permissions:
      contents: write   # for posting the coverage report as a commit comment
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4.3.1
        with:
          submodules: false
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build lcov
      - name: Configure with coverage
        run: |
          cmake -B build-cov -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DZSERIO_C_COVERAGE=ON \
            -DZSERIO_C_WERROR=OFF
      - name: Build
        run: cmake --build build-cov
      - name: Run tests
        run: ctest --test-dir build-cov --output-on-failure
      - name: Capture coverage
        run: |
          lcov --capture --directory build-cov --output-file coverage.info \
               --rc lcov_branch_coverage=1 --ignore-errors mismatch,unused,gcov
          lcov --extract coverage.info '*/runtime/*' \
               --output-file coverage-runtime.info \
               --rc lcov_branch_coverage=1
          lcov --summary coverage-runtime.info \
               --rc lcov_branch_coverage=1 2>&1 | tee coverage-summary.txt
      - name: Check thresholds
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_coverage.py coverage-runtime.info | tee coverage-report.txt
      - name: Post coverage report as commit comment
        # Push events only: fork PRs run with a read-only token,
        # so posting would fail the job; PR feedback is the check
        # status itself.
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          {
            printf 'coverage report for commit %s:\n\n```\n' "${GITHUB_SHA}"
            cat coverage-report.txt 2>/dev/null || cat coverage-summary.txt
            printf '\n```\n'
          } > /tmp/comment_body.md
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -F body=@/tmp/comment_body.md \
            -H 'Accept: application/vnd.github+json'

  xvalidation:
    name: Wire-format cross-validation (REQ-FN-001)
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || '["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 120
    permissions:
      contents: write   # for posting the harness summary as a commit comment
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4.3.1
        with:
          submodules: false
      - name: Init submodules
        # Both upstream zserio (the cpp-extension generator + cpp
        # runtime sources used as wire-format oracle) and the
        # zserio-test-data corpus.
        run: |
          git submodule update --init third_party/zserio
          git submodule update --init third_party/zserio-test-data
      - name: Install build tools
        # ant builds the upstream bundle jar; cmake + ninja drive
        # the zserio_c_gen build; python3 runs the roundtrip-driver
        # generator; gcc/g++ already on the runner image but the
        # explicit install keeps the step self-documenting.
        run: sudo apt-get update && sudo apt-get install -y ant gcc g++ cmake ninja-build python3
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9   # v4.8.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache upstream zserio jars
        # Two artifacts cached together: zserio_core.jar (drives our
        # generator) and zserio.jar (the bundle with the cpp
        # extension, drives the oracle). Both rebuild from the same
        # source under compiler/.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: build-jars
          key: zserio-bundle-${{ hashFiles('third_party/zserio/compiler/**', 'third_party/zserio/build.xml') }}
      - name: Build upstream zserio_core.jar
        run: tools/build_zserio_core_jar.sh
      - name: Build upstream zserio.jar (bundle)
        run: tools/build_zserio_bundle_jar.sh
      - name: Build zserio_c.jar
        run: tools/build_generator_jar.sh
      - name: Build C-native zserio_c_gen
        # The C-native zserio_c_gen is the C-side generator; the
        # xvalidation harness now invokes build/parser/zserio_c_gen
        # for the C side of each schema.
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target zserio_c_gen
      - name: Cache cpp runtime + harness scratch
        # The cpp runtime static lib is ~10MB and rebuilds in ~30s.
        # Cache it across runs keyed on the cpp-runtime sources.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: |
            build-xvalidation/libZserioCppRuntime.a
            build-xvalidation/cpp_rt_objs
            build-xvalidation/runtime-objs
          key: xval-rt-${{ hashFiles('third_party/zserio/compiler/extensions/cpp/runtime/src/**', 'runtime/src/**', 'runtime/include/**') }}
      - name: Run xvalidation harness
        # Five seeds × 182 schemas = 910 byte-equal round-trips per
        # run. Exits non-zero on any wire-format divergence, surfaced
        # here so a regression blocks the merge.
        shell: bash
        run: |
          set -o pipefail
          SEEDS="1 2 7 42 999" \
            bash tests/xvalidation/run_xvalidation.sh 2>&1 | tee /tmp/xval.log
      - name: Static check — no allocator in _write paths (REQ-FN-016)
        # Strict static check: scan every `_write` function in the
        # runtime and in the generated output produced by the xval
        # harness; assert none takes or references an allocator.
        shell: bash
        run: |
          set -e
          GEN_DIRS=()
          while IFS= read -r d; do
            GEN_DIRS+=(--gen "$d")
          done < <(find build-xvalidation -maxdepth 2 -type d -name c_out | sort)
          # Fail closed: if no generated trees were found the gate would
          # otherwise scan nothing and pass vacuously (REQ-FN-016).
          if [ "${#GEN_DIRS[@]}" -eq 0 ]; then
            echo "FAIL: no c_out generated directories found under build-xvalidation" >&2
            exit 1
          fi
          python3 tools/check_no_alloc_in_writers.py "${GEN_DIRS[@]}"
      - name: Summarize xvalidation result
        if: always()
        run: |
          set -u
          PASS_LINE="$(grep -E '^xval: [0-9]+ schemas passed' /tmp/xval.log | tail -1)"
          FAIL_LIST="$(grep -E 'failed|MISMATCH' /tmp/xval.log | head -20)"
          {
            echo "${PASS_LINE:-(no summary line found)}"
            if [[ -n "${FAIL_LIST}" ]]; then
              echo
              echo "First failures:"
              echo "${FAIL_LIST}"
            fi
          } > /tmp/xval-summary.txt
          cat /tmp/xval-summary.txt
      - name: Post xvalidation summary as commit comment
        # Push events only: fork PRs run with a read-only token,
        # so posting would fail the job; PR feedback is the check
        # status itself.
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          {
            printf 'xvalidation (REQ-FN-001) for commit %s:\n\n```\n' "${GITHUB_SHA}"
            cat /tmp/xval-summary.txt 2>/dev/null || echo "(no summary captured)"
            printf '\n```\n\nFull log (last 50KB):\n\n```\n'
            tail -c 50000 /tmp/xval.log 2>/dev/null || echo "(no log captured)"
            printf '\n```\n'
          } > /tmp/comment_body.md
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -F body=@/tmp/comment_body.md \
            -H 'Accept: application/vnd.github+json'
      - name: Upload xvalidation log + diverged bins
        # If a wire-format check fails, the diverged bytes_c.bin /
        # bytes_cpp.bin pair lands under build-xvalidation/<schema>/;
        # uploading the whole tree gives us the diagnostic data
        # without having to reproduce locally.
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: xvalidation-failure
          path: |
            build-xvalidation/**/bytes_c.s*.bin
            build-xvalidation/**/bytes_cpp.s*.bin
            /tmp/xval.log
