name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  traceability:
    name: Requirements traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run traceability check
        run: python3 tools/check_traceability.py

  build-and-test:
    name: Build and test (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc
          - compiler: clang
            cc: clang
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang
      - name: Configure
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Debug
        env:
          CC: ${{ matrix.cc }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  misra:
    name: MISRA C:2012 (cppcheck) + forbidden-symbols
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Run MISRA + forbidden-symbols check
        # Non-strict on first pass: surfaces cppcheck findings but only
        # fails on the clear-cut forbidden-symbol checks (REQ-FS-001,
        # REQ-FS-002). Promote to --strict once findings are triaged.
        run: tools/run_misra.sh
      - name: Upload cppcheck log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-log
          path: cppcheck.log

  # Phase 1 follow-ups: coverage.yml (gcov/lcov gated at 100% line+branch),
  # size.yml (REQ-PF-002 regression gating). Added when those modules'
  # support arrives.
