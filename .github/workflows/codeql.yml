# CodeQL — semantic / dataflow static analysis for the C runtime + parser.
#
# IMPORTANT — licensing: CodeQL code scanning is free only for *public*
# repositories. On a *private* repo it requires GitHub Advanced Security
# (bundled with GitHub Enterprise, or the standalone "GitHub Code Security"
# add-on, both per-committer paid). Without it the upload step fails with
# "Advanced Security must be enabled for this repository".
#
# To avoid putting a red check on every pull request while that is being
# sorted out, this workflow intentionally does NOT run on `pull_request`:
# it runs on pushes to main, on a weekly schedule, and on manual dispatch.
# Once Advanced Security is confirmed enabled, add `pull_request:` to the
# triggers below to gate PRs on the results.

name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 05:17 UTC (off-peak, arbitrary minute to avoid the
    # top-of-hour scheduling stampede).
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (C)
    runs-on: [self-hosted, linux, x64]
    permissions:
      security-events: write   # upload SARIF results to the Security tab
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake clang

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          # security-and-quality adds the maintainability/reliability
          # queries on top of the default security set.
          queries: security-and-quality

      - name: Build (runtime + parser)
        # Manual build mode: configure + build the C targets so CodeQL
        # traces real compilations. Tests are disabled so the build does
        # not depend on fetching the Unity test dependency.
        run: |
          cmake -B build-codeql -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DZSERIO_C_BUILD_TESTS=OFF \
            -DZSERIO_C_WERROR=OFF
          cmake --build build-codeql

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c-cpp"
