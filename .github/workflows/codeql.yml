# CodeQL — semantic / dataflow static analysis for the C runtime + parser.
#
# Licensing: CodeQL code scanning is free for public repositories.
# The workflow gates pull requests as well as pushes to main, plus a
# weekly scheduled scan and manual dispatch. Runner policy matches
# ci.yml: same-repo runs use the self-hosted org runners; fork PRs
# fall back to GitHub-hosted — they must never reach the
# self-hosted machines (see docs/ci-self-hosted.md).

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 05:17 UTC (off-peak, arbitrary minute to avoid the
    # top-of-hour scheduling stampede).
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (C)
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || '["self-hosted", "linux", "x64"]') }}
    timeout-minutes: 45
    permissions:
      security-events: write   # upload SARIF results to the Security tab
      contents: read
      actions: read            # private repos: analyze reads the workflow run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          submodules: false

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake clang

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a   # v4.37.1
        with:
          languages: c-cpp
          # security-extended: the deeper security query set without
          # the maintainability/style queries. Style, complexity, and
          # documentation are already owned by dedicated gates
          # (clang-tidy bugprone/cert/clang-analyzer, cppcheck MISRA
          # C:2012), so the "quality" half of security-and-quality
          # only double-reports what those gates cover — and reports
          # it against the build-time parser tool, not the shipped
          # runtime. Keeping CodeQL on security lets it focus on the
          # one surface that matters here: the untrusted-bitstream
          # decode path in the runtime.
          queries: security-extended
          config: |
            paths-ignore:
              - tests
          # Note: `paths-ignore` filters where alerts are *reported*,
          # not what is compiled — CodeQL still traces the full build
          # for dataflow, it just suppresses findings whose location
          # is under tests/ (Unity fixtures, driver scaffolding).

      - name: Build (runtime + parser)
        # Manual build mode: configure + build the C targets so CodeQL
        # traces real compilations. Tests are disabled so the build does
        # not depend on fetching the Unity test dependency.
        #
        # The build dir is removed first: on the persistent
        # self-hosted runners a leftover build-codeql/ from a
        # previous run would make `cmake --build` a no-op, CodeQL
        # would trace zero compilations, and the run would fail
        # with an empty database ("No source code was seen"). A
        # from-scratch build guarantees every translation unit is
        # compiled and traced. (No-op on the ephemeral hosted
        # runners that fork PRs use.)
        run: |
          rm -rf build-codeql
          cmake -B build-codeql -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DZSERIO_C_BUILD_TESTS=OFF \
            -DZSERIO_C_WERROR=OFF
          cmake --build build-codeql

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a   # v4.37.1
        with:
          category: "/language:c-cpp"
